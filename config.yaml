# Policy Verification System - all settings in one place.
#
# Every value here has a default in src/policyverify/config.py, so this file
# only needs to list what you want to change. Delete a line and the default
# takes over.
#
# The values you will actually touch while building:
#   llm.model                     -> qwen3:4b while learning, qwen3:8b later
#   retrieval.top_k               -> how many passages to pull per question
#   abstention.min_claim_score    -> how strict the system is (tune in Phase 6)

paths:
  manifest: data/manifest.yaml
  raw: data/raw
  processed: data/processed
  index: data/index
  runs: eval/results

embedding:
  # Turns text into vectors so we can search by meaning, not just keywords.
  # Runs on CPU so the whole GPU stays free for Qwen.
  model_name: BAAI/bge-base-en-v1.5
  device: cpu
  batch_size: 32
  query_prefix: "Represent this sentence for searching relevant passages: "

chunking:
  # Split on headings, so each chunk is a whole section and a citation like
  # "4.2" points at something real. These limits are only a fallback for
  # sections that are unusually long or short.
  # 2026-11-20: back to 1800/150 from the 800/120 tried on 19 Nov. Measured
  # on the tuning split: no clear difference between the two sizes, and all
  # reported results were measured with 1800.
  max_chars: 1800
  min_chars: 120
  overlap_chars: 150
  # One short summary per section, carried by every chunk of that section,
  # so a small window keeps the context of the section around it. It helps
  # search and is shown to the model as context. It is never used to verify
  # a claim. Summaries are cached in data/processed/section_summaries.json.
  # 2026-11-20: OFF. Measured on the tuning split, summaries attached to
  # every passage cost 6-12 points of accuracy: all passages of a section
  # look alike to search, so the exact rule (e.g. R 8.2, the pass mark)
  # dropped out of the top 6. Code kept; switch on to experiment.
  summaries: false
  summary_max_chars: 400
  summary_input_chars: 12000
  summary_in_prompt: false

retrieval:
  top_k: 6
  # Our main defence against answering with the wrong university's policy.
  enable_university_filter: true
  # Entity re-ranking: a passage naming the same people as the question
  # (parent, warden, hosteller...) gets  min(cap, weight * idf)  added to
  # its similarity for ordering only. The similarity used for abstention
  # is unchanged. Weights (idf) are computed from the corpus at build time.
  # 2026-11-20: OFF - measured slightly harmful on the tuning split.
  entity_boost: false
  entity_boost_weight: 0.1
  entity_boost_cap: 0.05
  # Audience filter: each section is labelled at index time with who it is
  # for (student, parent_visitor, staff), each question by a word list, and
  # retrieval keeps only chunks for the question's audience.
  # 2026-11-20: OFF - no measurable effect (only 2 of 454 chunks were
  # labelled parent/visitor, so it almost never filtered anything).
  audience_filter: false

llm:
  backend: ollama
  # 2026-11-20: default changed to qwen3.5:9b (chosen by the student). Measured
  # on the tuning split: 0% hallucination and every unanswerable question
  # declined, but more answerable questions declined (9 of 26 vs 4 of 26) and
  # about 1.5x slower than qwen3:4b. Backup: qwen3:4b - set
  # POLICYVERIFY_LLM_MODEL=qwen3:4b, or change this line back.
  model: qwen3.5:9b
  # 0 means the same question gives the same answer every time. Required for
  # debugging and evaluation - not a style choice.
  temperature: 0.0
  # Generous: with no GPU a normal answer takes over a minute.
  timeout_seconds: 300
  # Cap on reply length, so a runaway generation cannot hang a question.
  # 1500 fits the six claims the prompt asks for; 800 cut replies off.
  max_tokens: 1500
  num_ctx: 8192

nli:
  # The fact-checker. Decides whether a passage actually proves a claim.
  # Confirm this choice by running: python spikes/spike_nli.py
  model_name: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  device: cpu
  entailment_threshold: 0.5

verification:
  numeric_exact_match: true
  fail_on_missing_citation: true
  # 2026-11-20: table-row check (verify/table.py). Supports a claim the NLI
  # model missed when exactly ONE table row holds its numbers (or a range
  # containing them), words and names. Never refutes. Measured: tuning
  # unchanged, no new false accepts, fresh 49 +2 points.
  table_row_check: true

abstention:
  # Tune these on the TUNING half of the adversarial set in Phase 6.
  # Report your final numbers on the held-out half only.
  min_claim_score: 0.5
  min_supported_claims: 1
  # Retired: no longer read by abstain.py (it never fired; see config.py).
  min_retrieval_score: 0.25
